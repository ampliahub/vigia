name: Vigiar os sites (reserva manual)

# Desde 15/11/2026 o Vigia roda na Cloudflare a cada 3 minutos (pasta cloudflare/).
# Aqui ficou só o disparo manual, pra teste ou se a Cloudflare parar.
# O agendamento foi tirado pra não chegar aviso em dobro.
on:
  workflow_dispatch:
    inputs:
      teste:
        description: "Só mandar um e-mail de teste"
        type: boolean
        default: false

permissions:
  contents: write # gravar o estado.json

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir os sites
        run: node vigiar.mjs
        env:
          VIGIA_TESTE: ${{ inputs.teste }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_MAILBOX_RESOURCE_ID: ${{ secrets.HOSTINGER_MAILBOX_RESOURCE_ID }}
          VIGIA_DESTINOS: ${{ secrets.VIGIA_DESTINOS }}
      - name: Gravar o estado se mudou
        run: |
          if ! git diff --quiet estado.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "Estado dos sites: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
